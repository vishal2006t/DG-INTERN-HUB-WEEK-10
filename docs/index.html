<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/dg-interns-hub-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DG Interns Hub - Discover practical internship opportunities, build real-world skills, and take the next step toward your career. Student-friendly internships for tech freshers." />
    <title>DG Interns Hub | Discover Real Internships & Launch Your Career</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Fallback for static GitHub Pages root deployment where ./src/main.jsx is unbundled
      if (window.location.hostname.includes('github.io') && !document.querySelector('script[src*="assets/index.js"]')) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.crossOrigin = 'anonymous';
        link.href = './assets/index.css';
        document.head.appendChild(link);

        const script = document.createElement('script');
        script.type = 'module';
        script.crossOrigin = 'anonymous';
        script.src = './assets/index.js';
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
